<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Circle — By Infinity</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --sky:#06b6d4; --sky2:#0ea5e9; --dark:#0d1117; --bg:#060a0f; }
    html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }

    .bg   { position:fixed; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 40%, #071e2e 0%, var(--bg) 70%); }
    .grid { position:fixed; inset:0;
      background-image:linear-gradient(rgba(6,182,212,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,0.04) 1px,transparent 1px);
      background-size:60px 60px; animation:gridDrift 20s linear infinite; }
    @keyframes gridDrift { to { transform:translateY(60px); } }

    .particles { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
    .dot { position:absolute; border-radius:50%; opacity:0; animation:floatDot var(--dur,8s) var(--delay,0s) ease-in-out infinite; }
    @keyframes floatDot {
      0%   { transform:translateY(100vh) scale(0); opacity:0; }
      10%  { opacity:0.45; }
      90%  { opacity:0.1; }
      100% { transform:translateY(-20vh) scale(1); opacity:0; }
    }

    /* ── SPLASH ── */
    .splash { position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:0;
      animation:fadeOut 0.8s ease-in-out 3.8s forwards; }
    @keyframes fadeOut { to { opacity:0; pointer-events:none; } }

    /* ── GLOW ── */
    .glow { position:absolute; width:320px; height:320px; border-radius:50%;
      background:radial-gradient(circle, rgba(6,182,212,0.07) 0%, transparent 70%);
      opacity:0; animation:glowIn 1s ease 0.3s forwards, glowPulse 3s ease-in-out 1.3s infinite; }
    @keyframes glowIn    { to { opacity:1; } }
    @keyframes glowPulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.1);opacity:.25} }

    /* ── LOGO ROW ── */
    .logo-row { display:flex; align-items:center; position:relative; z-index:2;
      opacity:0; transform:translateY(24px); animation:riseIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s forwards; }
    @keyframes riseIn { to { opacity:1; transform:translateY(0); } }

    .logo-wrap { position:relative; width:220px; height:220px; }

    .luse-img {
      width:220px; height:220px;
      object-fit:contain; display:block;
      filter:drop-shadow(0 0 6px rgba(30,143,0,0.18));
    }

    /* ── SUBTLE GLOW UNDER LOGO ── */
    .logo-ground-glow {
      position:absolute;
      bottom:-18px; left:50%;
      transform:translateX(-50%);
      width:160px; height:24px;
      border-radius:50%;
      background:radial-gradient(ellipse 100% 100% at 50% 50%, rgba(6,182,212,0.22) 0%, transparent 100%);
      filter:blur(8px);
      opacity:0;
      animation:groundIn 1s ease 1s forwards, groundPulse 3s ease-in-out 2s infinite;
    }
    @keyframes groundIn    { to { opacity:1; } }
    @keyframes groundPulse { 0%,100%{opacity:.9;width:160px} 50%{opacity:.45;width:130px} }

    /* ── LIGHTNING ── */
    .lightning-svg {
      position:absolute; inset:0; width:100%; height:100%;
      pointer-events:none; overflow:visible;
    }
    .trace-top,.trace-bot {
      fill:none; stroke:#fff; stroke-width:1.2; stroke-linecap:round;
      opacity:0; stroke-dasharray:12 380; stroke-dashoffset:0;
    }
    .trace-left,.trace-right {
      fill:none; stroke:#fff; stroke-width:1.0; stroke-linecap:round;
      opacity:0; stroke-dasharray:10 200; stroke-dashoffset:0;
    }
    .trace-top   { animation:traceTop   1.1s  linear 1.8s  infinite; }
    .trace-bot   { animation:traceBot   1.1s  linear 2.15s infinite; }
    .trace-left  { animation:traceLeft  0.85s linear 2.4s  infinite; }
    .trace-right { animation:traceRight 0.85s linear 2.65s infinite; }
    @keyframes traceTop   { 0%{stroke-dashoffset:392;opacity:0} 4%{opacity:0.9}  90%{opacity:0.85} 96%{opacity:0} 100%{stroke-dashoffset:0;opacity:0} }
    @keyframes traceBot   { 0%{stroke-dashoffset:392;opacity:0} 4%{opacity:0.85} 90%{opacity:0.8}  96%{opacity:0} 100%{stroke-dashoffset:0;opacity:0} }
    @keyframes traceLeft  { 0%{stroke-dashoffset:210;opacity:0} 5%{opacity:0.8}  88%{opacity:0.75} 96%{opacity:0} 100%{stroke-dashoffset:0;opacity:0} }
    @keyframes traceRight { 0%{stroke-dashoffset:210;opacity:0} 5%{opacity:0.8}  88%{opacity:0.75} 96%{opacity:0} 100%{stroke-dashoffset:0;opacity:0} }

    /* ── TEXT BLOCK ── */
    .text-block {
      margin-top:28px;
      text-align:center;
      position:relative; z-index:2;
      opacity:0; transform:translateY(14px);
      animation:riseIn 0.9s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
    }

    .brand-name {
      font-family:'Cinzel', serif;
      font-size:clamp(1.1rem, 3vw, 1.55rem);
      font-weight:600;
      letter-spacing:0.22em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.88);
      text-shadow:
        0 0 18px rgba(6,182,212,0.35),
        0 0 40px rgba(6,182,212,0.12);
    }

    /* thin divider line under text */
    .text-rule {
      width:60px; height:1px;
      background:linear-gradient(to right, transparent, rgba(6,182,212,0.45), transparent);
      margin:10px auto 0;
    }

    /* ── APP ── */
    .app { position:fixed; inset:0; background:var(--dark); opacity:0; pointer-events:none;
      animation:appIn 0.8s ease 4.6s forwards; }
    @keyframes appIn { to { opacity:1; pointer-events:all; } }
  </style>
</head>
<body>

  <div class="grid"></div>
  <div class="particles" id="pt"></div>

    <div class="glow"></div>
